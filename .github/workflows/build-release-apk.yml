name: Build Android APK (Release, CI-signed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_FILE: app/release-ci.keystore
      STORE_PASSWORD: password123
      KEY_ALIAS: release
      KEY_PASSWORD: password123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore $STORE_FILE -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI, OU=Apps, O=WorkHours, L=City, S=State, C=US" \
            -storepass $STORE_PASSWORD -keypass $KEY_PASSWORD

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          gradle wrapper --gradle-version 8.7

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkHoursApp-release-apk
          path: app/build/outputs/apk/release/*.apk
